[project]
name = "ttps"
version = "0.1.0"
description = "Sistema de Seguimiento de Estudios de Exoma Clinico (TTPS-E)"
authors = [
    {name = "Daniela Calizaya", email = "danicalivilla@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask (>=3.1.3,<4.0.0)",
    "flask-sqlalchemy-lite (>=0.2.1,<0.3.0)",
    "sqlalchemy (>=2.0.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "marshmallow (>=4.3.1,<5.0.0)",
    "requests (>=2.34.2,<3.0.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "src", from = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
ruff = ">=0.9.0"
