<svg xmlns="http://www.w3.org/2000/svg" width="640" height="627" viewBox="0 0 640 627" role="img" aria-labelledby="titulo descripcion">
<title id="titulo">Familiograma</title>
<desc id="descripcion">Relaciones familiares informadas por el médico. Relleno sólido: diagnóstico; líneas: sospecha propuesta. El diagrama no establece diagnósticos.</desc>
<rect width="640" height="627" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#172b3a}.linea{fill:none;stroke:#475569;stroke-width:2;stroke-linejoin:round}.nombre{font-size:14px;font-weight:700}.etiqueta{font-size:13px}.nota{font-size:12px;fill:#526475}</style>
<text x="40" y="42" font-size="25" font-weight="700">Familiograma</text>
<text x="40" y="66" class="nota">Familia informada · Flecha: paciente · Diagonal: fallecimiento</text>
